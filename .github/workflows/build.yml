name: Build PrefixHQ

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  release:
    types: [ created ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Upgrade pip
        run: python -m pip install --upgrade pip

      - name: Install dependencies
        run: |
          if [ -f requirements.txt ]; then
            pip install -r requirements.txt
          fi

      - name: Install PyInstaller
        run: pip install pyinstaller

      - name: Build executable
        run: |
          pyinstaller --onefile PrefixHQ.py --name PrefixHQ

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: PrefixHQ-build
          path: dist/PrefixHQ

  build-flatpak:
    runs-on: ubuntu-latest
    if: github.event_name == 'release'
    container:
      image: ghcr.io/flathub-infra/flatpak-github-actions:gnome-46
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install flatpak-builder
        run: |
          flatpak remote-add --if-not-exists flathub https://flathub.org/repo/flathub.flatpakrepo
          flatpak install org.kde.Platform//6.6
          flatpak install org.kde.Sdk//6.6

      - name: Build Flatpak
        run: |
          cd flatpak
          flatpak-builder --user --install --force-clean build-dir com.github.Nastas95.PrefixHQ.json

      - name: Create Flatpak bundle
        run: |
          cd flatpak
          flatpak build-bundle build-dir com.github.Nastas95.PrefixHQ.flatpak com.github.Nastas95.PrefixHQ

      - name: Upload Flatpak to release
        uses: softprops/action-gh-release@v1
        with:
          files: flatpak/com.github.Nastas95.PrefixHQ.flatpak
          append_body: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
